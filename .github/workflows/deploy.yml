name: Tests & Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Préparer le site statique
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js src icons assets _site/
      - name: Vérifier que tout ce que le service worker précache est bien là
        run: |
          # Un fichier oublié ici passe inaperçu : les tests verdissent, le
          # déploiement réussit, mais le jeu se dégrade en silence côté joueur.
          node -e '
            const fs = require("fs");
            const sw = fs.readFileSync("sw.js", "utf8");
            const bloc = sw.slice(sw.indexOf("const PRECACHE"), sw.indexOf("];", sw.indexOf("const PRECACHE")));
            const fichiers = [...bloc.matchAll(/["\x27]\.\/([^"\x27]+)["\x27]/g)].map(m => m[1]).filter(Boolean);
            const manquants = fichiers.filter(f => !fs.existsSync("_site/" + f));
            if (manquants.length) {
              console.error("Absents du site déployé :\n  " + manquants.join("\n  "));
              process.exit(1);
            }
            console.log(fichiers.length + " fichiers précachés, tous présents.");
          '
      - name: Vérifier que tout module chargé est dans le PRECACHE (sens inverse)
        run: |
          # Sens inverse : un module src/ importé (ou script de index.html) mais
          # OUBLIÉ au PRECACHE casse le jeu hors-ligne après mise à jour. On parse
          # les imports de tous les modules src/ + les scripts de index.html.
          node -e '
            const fs = require("fs"), path = require("path");
            const sw = fs.readFileSync("sw.js", "utf8");
            const bloc = sw.slice(sw.indexOf("const PRECACHE"), sw.indexOf("];", sw.indexOf("const PRECACHE")));
            const precaches = new Set([...bloc.matchAll(/["\x27]\.\/([^"\x27]+)["\x27]/g)].map(m => m[1]));
            const besoins = new Set();
            const html = fs.readFileSync("index.html", "utf8");
            for (const m of html.matchAll(/<script[^>]*src="\.\/([^"]+)"/g)) besoins.add(m[1]);
            const visit = (f) => {
              if (!fs.existsSync(f) || besoins.has(f)) return;
              besoins.add(f);
              const txt = fs.readFileSync(f, "utf8");
              for (const m of txt.matchAll(/from\s*["\x27]\.\/([^"\x27]+)["\x27]/g)) visit(m[1]);
            };
            for (const f of fs.readdirSync("src")) if (f.endsWith(".js")) visit("src/" + f);
            const manquants = [...besoins].filter(f => !precaches.has(f));
            if (manquants.length) {
              console.error("Chargés mais ABSENTS du PRECACHE :\n  " + manquants.join("\n  "));
              process.exit(1);
            }
            console.log(besoins.size + " modules chargés, tous précachés.");
          '
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
